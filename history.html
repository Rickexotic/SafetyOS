<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SafetyOS - Incident History</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="./css/style.css">

    <!-- MSAL -->
    <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.0/lib/msal-browser class="container mt-3">

    <div class="card">

        <div class="card-header">

            <h2>SafetyOS</h2>

            <small>
                Incident History
            </small>

        </div>

        <div class="card-body">

            <!-- User Info -->

            <div class="user-card mb-3">

                <div class="user-title">
                    Logged User
                </div>

                <div id="userInfo"
                     class="user-value">

                    Loading...

                </div>

            </div>

            <!-- Search -->

            <div class="mb-3">

                <input
                    type="text"
                    id="searchBox"
                    class="form-control"
                    placeholder="Search incidents...">

            </div>

            <!-- Incident List -->

            <div id="incidentHistory">

                <div class="text-center text-secondary">

                    Loading incidents...

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Bottom Navigation -->

<nav class="bottom-nav">

    <!-- Dashboard -->

    <a href="dashboard.html"
       class="nav-item">

        <div class="nav-icon">
            📈
        </div>

        <div class="nav-label">
            Dashboard
        </div>

    </a>

    <!-- History -->

    <a href="history.html"
       class="nav-item active">

        <div class="nav-icon">
            📄
        </div>

        <div class="nav-label">
            History
        </div>

    </a>

    <!-- Report -->

    <a href="index.html"
       class="nav-item">

        <div class="nav-icon">
            ➕
        </div>

        <div class="nav-label">
            Report
        </div>

    </a>

</nav>

<!-- Scripts -->

./js/config.jsscript>

./js/auth.jsscript>

./js/history.jsscript>

</body>
