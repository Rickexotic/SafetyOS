<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SafetyOS Dashboard</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="./css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.0/lib/msal-browser.min.js"></script>

</head>

<body>

<div class="container mt-3">

    <div class="card">

        <div class="card-content">

                <div>

                    <h2>SafetyOS</h2>

                    <small>
                        Dashboard
                    </small>

                </div>

                <div id="profileContainer">

                    <img
                        id="profilePhoto"
                        class="profile-photo d-none">

                    <div
                        id="profileInitials"
                        class="profile-initials">

                        RH

                    </div>

                </div>

            </div>

        </div>

        <div class="card-body">

            <div class="dashboard-grid">

                <div class="kpi-card">

                    <div class="kpi-label">
                        Total
                    </div>

                    <div id="kpiTotal"
                         class="kpi-value">

                        -
                    </div>

                </div>

                <div class="kpi-card">

                    <div class="kpi-label">
                        Open
                    </div>

                    <div id="kpiOpen"
                         class="kpi-value">

                        -
                    </div>

                </div>

                <div class="kpi-card">

                    <div class="kpi-label">
                        Critical
                    </div>

                    <div id="kpiCritical"
                         class="kpi-value">

                        -
                    </div>

                </div>

                <div class="kpi-card">

                    <div class="kpi-label">
                        Closed
                    </div>

                    <div id="kpiClosed"
                         class="kpi-value">

                        -
                    </div>

                </div>

            </div>

            <div class="section-title">
                Severity
            </div>

            <div id="severitySummary">
            </div>

            <div class="section-title mt-3">
                Top Sites
            </div>

            <div id="siteSummary">
            </div>

        </div>

    </div>

</div>

<nav class="bottom-nav">

    <a href="dashboard.html"
       class="nav-item active">

        <div class="nav-icon">
            <!-- same dashboard SVG -->
        </div>

        <div class="nav-label">
            Dashboard
        </div>

    </a>

    <a href="history.html"
       class="nav-item">

        <div class="nav-icon">
            <!-- same history SVG -->
        </div>

        <div class="nav-label">
            History
        </div>

    </a>

    report.html

        <div class="nav-icon">
            <!-- same report SVG -->
        </div>

        <div class="nav-label">
            Report
        </div>

    </a>

</nav>

./js/config.jsscript>
./js/auth.jsscript>
./js/dashboard.jsscript>

</body>

</html>
