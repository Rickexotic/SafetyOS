<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SafetyOS Dashboard</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="./css/style.css">

    <!-- MSAL -->
    <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.0/lib/msal-browser.min.js"></script>

</head>

<body>

<div class="container mt-3">

    <div class="card">

        <div class="card-header">

            <div class="header-content">

                <div>

                    <h2>SafetyOS</h2>

                    <small>
                        Dashboard
                    </small>

                </div>

                <div id="profileContainer">

                    <img
                        id="profilePhoto"
                        class="profile-photo d-none">

                    <div
                        id="profileInitials"
                        class="profile-initials">

                        RH

                    </div>

                </div>

            </div>

        </div>

        <div class="card-body">

            <div class="dashboard-grid">

                <div class="kpi-card">

                    <div class="kpi-label">
                        Total
                    </div>

                    <div id="kpiTotal"
                         class="kpi-value">

                        -
                    </div>

                </div>

                <div class="kpi-card">

                    <div class="kpi-label">
                        Open
                    </div>

                    <div id="kpiOpen"
                         class="kpi-value">

                        -
                    </div>

                </div>

                <div class="kpi-card">

                    <div class="kpi-label">
                        Critical
                    </div>

                    <div id="kpiCritical"
                         class="kpi-value">

                        -
                    </div>

                </div>

                <div class="kpi-card">

                    <div class="kpi-label">
                        Closed
                    </div>

                    <div id="kpiClosed"
                         class="kpi-value">

                        -
                    </div>

                </div>

            </div>

            <div class="section-title">
                Severity
            </div>

            <div id="severitySummary">
            </div>

            <div class="section-title mt-3">
                Top Sites
            </div>

            <div id="siteSummary">
            </div>

        </div>

    </div>

</div>

<nav class="bottom-nav">

    <!-- Dashboard -->

    <a href="dashboard.html"
       class="nav-item active">

        <div class="nav-icon">

            <svg xmlns="http://www.w3.org/2000/svg"
                 width="20"
                 height="20"
                 fill="currentColor"
                 class="bi bi-graph-up"
                 viewBox="0 0 16 16">

                <path fill-rule="evenodd"
                      d="M0 0h1v15h15v1H0zm14.817 3.113a.5.5 0 0 1 .07.704l-4.5 5.5a.5.5 0 0 1-.74.037L7.06 6.767l-3.656 5.027a.5.5 0 0 1-.808-.588l4-5.5a.5.5 0 0 1 .758-.06l2.609 2.61 4.15-5.073a.5.5 0 0 1 .744.064z"/>

            </svg>

        </div>

        <div class="nav-label">
            Dashboard
        </div>

    </a>

    <!-- History -->

    <a href="history.html"
       class="nav-item">

        <div class="nav-icon">

            <svg xmlns="http://www.w3.org/2000/svg"
                 width="20"
                 height="20"
                 fill="currentColor"
                 class="bi bi-file-earmark-text"
                 viewBox="0 0 16 16">

                <path d="M5.5 7a.5.5 0 0 0 0 1h5a.5.5 0 0 0 0-1zM5 9.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5m0 2a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5"/>

                <path d="M9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4.5zm0 1v2A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1z"/>

            </svg>

        </div>

        <div class="nav-label">
            History
        </div>

    </a>

    <!-- Report -->

    <a href="report.html"
       class="nav-item">

        <div class="nav-icon">

            <svg xmlns="http://www.w3.org/2000/svg"
                 width="20"
                 height="20"
                 fill="currentColor"
                 class="bi bi-file-earmark-plus"
                 viewBox="0 0 16 16">

                <path d="M8 6.5a.5.5 0 0 1 .5.5v1.5H10a.5.5 0 0 1 0 1H8.5V11a.5.5 0 0 1-1 0V9.5H6a.5.5 0 0 1 0-1h1.5V7a.5.5 0 0 1 .5-.5"/>

                <path d="M14 4.5V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h5.5zm-3 0A1.5 1.5 0 0 1 9.5 3V1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4.5z"/>

            </svg>

        </div>

        <div class="nav-label">
            Report
        </div>

    </a>

</nav>

<script src="./js/config.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/graph.js"></script>
<script src="./js/dashboard.js"></script>
<script src="./js/navigation.js"></script>

</body>

</html>
