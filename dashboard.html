<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SafetyOS Dashboard</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="./css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.0/lib/msal-browser.minnet/npm/chart.jsscript>

</head>

<body>

<div class="container mt-3">

    <div class="card">

        <div class="card-header">

            <div class="header-content">

                <div>

                    <h2>SafetyOS</h2>

                    <small>
                        Dashboard
                    </small>

                </div>

                <div id="profileContainer">

                    <img
                        id="profilePhoto"
                        class="profile-photo d-none">

                    <div
                        id="profileInitials"
                        class="profile-initials">

                        RH

                    </div>

                </div>

            </div>

        </div>

        <div class="card-body">

            <div class="dashboard-grid">

                <div class="kpi-card">

                    <div class="kpi-label">
                        Total Incidents
                    </div>

                    <div id="kpiTotal"
                         class="kpi-value">
                        -
                    </div>

                </div>

                <div class="kpi-card">

                    <div class="kpi-label">
                        Open Cases
                    </div>

                    <div id="kpiOpen"
                         class="kpi-value">
                        -
                    </div>

                </div>

                <div class="kpi-card">

                    <div class="kpi-label">
                        Critical
                    </div>

                    <div id="kpiCritical"
                         class="kpi-value">
                        -
                    </div>

                </div>

                <div class="kpi-card">

                    <div class="kpi-label">
                        Closed
                    </div>

                    <div id="kpiClosed"
                         class="kpi-value">
                        -
                    </div>

                </div>

            </div>

            <div class="dashboard-chart-card">

                <div class="section-title">
                    Risk Profile
                </div>

                <canvas id="riskRadar"></canvas>

            </div>

            <div class="dashboard-chart-card">

                <div class="section-title">
                    Severity Distribution
                </div>

                <canvas id="severityChart"></
