<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SafetyOS Settings</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="./css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.0/lib/msal-browser.min.js"></script>

</head>

<body>

<div class="container mt-3">

    <div class="card">

        <div class="card-header">

            <div class="header-content">

                <div
                    <small>
                        Settings
                    </small>

                </div>

                <div id="profileContainer">

                    <img
                        id="profilePhoto"
                        class="profile-photo d-none"
                        alt="Profile">

                    <div
                        id="profileInitials"
                        class="profile-initials">

                        RH

                    </div>

                </div>

            </div>

        </div>

        <div class="card-body">

            <div class="settings-grid">

                <!-- THEME -->

                <div class="settings-card">

                    <div class="settings-icon">

                        <svg xmlns="http://www.w3.org/2000/svg"
                             width="18"
                             height="18"
                             fill="currentColor"
                             viewBox="0 0 16 16">

                            <path d="M8 15A7 7 0 1 0 8 1zm0 1A8 8 0 1 1 8 0a8 8 0 0 1 0 16"/>

                        </svg>

                    </div>

                    <div>

                        <div class="settings-title">
                            Theme
                        </div>

                        <div class="settings-description">
                            Light / Dark Mode
                        </div>

                    </div>

                </div>

                <!-- USERS -->

                <div class="settings-card">

                    <div class="settings-icon">

                        <svg xmlns="http://www.w3.org/2000/svg"
                             width="18"
                             height="18"
                             fill="currentColor"
                             viewBox="0 0 16 16">

                            <path d="M15 14s1 0 1-1-1-4-5-4-5 3-5 4 1 1 1 1z"/>
                            <path d="M11 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4"/>

                        </svg>

                    </div>

                    <div>

                        <div class="settings-title">
                            Users
                        </div>

                        <div class="settings-description">
                            View Registered Users
                        </div>

                    </div>

                </div>

                <!-- ADD USER -->

                <div class="settings-card">

                    <div class="settings-icon">

                        <svg xmlns="http://www.w3.org/2000/svg"
                             width="18"
                             height="18"
                             fill="currentColor"
                             viewBox="0 0 16 16">

                            <path d="M12.5 16a3.5 3.5 0 1 0 0-7"/>
                            <path d="M8 7a2 2 0 1 0 0-4"/>

                        </svg>

                    </div>

                    <div>

                        <div class="settings-title">
                            Add User
                        </div>

                        <div class="settings-description">
                            Register New Users
                        </div>

                    </div>

                </div>

                <!-- PERMISSIONS -->

                <div class="settings-card">

                    <div class="settings-icon">

                        <svg xmlns="http://www.w3.org/2000/svg"
                             width="18"
                             height="18"
                             fill="currentColor"
                             viewBox="0 0 16 16">

                            <path d="M11 5a3 3 0 1 1-6 0"/>
                            <path d="M14 12.5a1.5 1.5 0 1 0-3 0"/>

                        </svg>

                    </div>

                    <div>

                        <div class="settings-title">
                            Roles & Permissions
                        </div>

                        <div class="settings-description">
                            User Access Management
                        </div>

                    </div>

                </div>

                <!-- SITES -->

                <div class="settings-card">

                    <div class="settings-icon">

                        <svg xmlns="http://www.w3.org/2000/svg"
                             width="18"
                             height="18"
                             fill="currentColor"
                             viewBox="0 0 16 16">

                            <path d="M5.793 1a1 1 0 0 1 1.414 0"/>
                            <path d="M8.793 2a1 1 0 0 1 1.414 0"/>

                        </svg>

                    </div>

                    <div>

                        <div class="settings-title">
                            Sites
                        </div>

                        <div class="settings-description">
                            View Locations
                        </div>

                    </div>

                </div>

                <!-- ADD SITE -->

                <div class="settings-card">

                    <div class="settings-icon">

                        <svg xmlns="http://www.w3.org/2000/svg"
                             width="18"
                             height="18"
                             fill="currentColor"
                             viewBox="0 0 16 16">

                            <path d="M8.707 1.5a1 1 0 0 0-1.414 0"/>
                            <path d="M16 12.5a3.5 3.5 0 1 1-7 0"/>

                        </svg>

                    </div>

                    <div>

                        <div class="settings-title">
                            Add Site
                        </div>

                        <div class="settings-description">
                            Register New Locations
                        </div>

                    </div>

                </div>

                <!-- ORGANIZATION -->

                <div class="settings-card">

                    <div class="settings-icon">

                        <svg xmlns="http://www.w3.org/2000/svg"
                             width="18"
                             height="18"
                             fill="currentColor"
                             viewBox="0 0 16 16">

                            <path fill-rule="evenodd"
                                  d="M6 3.5A1.5 1.5 0 0 1 7.5 2h1A1.5 1.5 0 0 1 10 3.5v1A1.5 1.5 0 0 1 8.5 6v1H14"/>

                        </svg>

                    </div>

                    <div>

                        <div class="settings-title">
                            Organization
                        </div>

                        <div class="settings-description">
                            Company Structure
                        </div>

                    </div>

                </div>

                <!-- GENERAL -->

                <div class="settings-card">

                    <div class="settings-icon">

                        <svg xmlns="http://www.w3.org/2000/svg"
                             width="18"
                             height="18"
                             fill="currentColor"
                             viewBox="0 0 16 16">

                            <path d="M8 4.754a3.246 3.246 0 1 0 0 6.492"/>
                            <path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0"/>

                        </svg>

                    </div>

                    <div>

                        <div class="settings-title">
                            General Settings
                        </div>

                        <div class="settings-description">
                            Application Configuration
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
