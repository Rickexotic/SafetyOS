<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SafetyOS Login</title>

    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<link rel="stylesheet" href="./css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.0/lib/msal-browser.min.js"></script>

    <style>

        .login-container{

            min-height:100vh;

            display:flex;

            align-items:center;

            justify-content:center;

            padding:20px;
        }

        .login-card{

            text-align:center;

            max-width:320px;
        }

        .login-title{

            font-size:2rem;

            font-weight:700;

            color:white;

            margin-bottom:6px;
        }

        .login-subtitle{

            color:#94a3b8;

            font-size:.9rem;

            margin-bottom:40px;
        }

        .fingerprint-button{

            border:none;

            background:transparent;

            cursor:pointer;

            padding:0;
        }

        .fingerprint-image{

            width:30px;

            transition:all .25s ease;

            filter:
                drop-shadow(
                    0 0 8px rgba(255,255,255,.15)
                );
        }

        .fingerprint-button:hover .fingerprint-image{

            transform:scale(1.05);

            filter:
                drop-shadow(
                    0 0 10px rgba(59,130,246,.35)
                )
                drop-shadow(
                    0 0 18px rgba(59,130,246,.20)
                );
        }

        .login-label{

            margin-top:14px;

            color:#cbd5e1;

            font-size:.85rem;
        }

        .login-footer{

            margin-top:40px;

            color:#64748b;

            font-size:.72rem;
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="login-title">
            SafetyOS
        </div>

        <div class="login-subtitle">
            AI Safety Platform
        </div>

       <button
  id="fingerprintLogin"
  class="fingerprint-button"
  onclick="loginAndContinue()">

           <img
    src="./images/huella blanco.png"
    alt="Fingerprint login"
    class="fingerprint-image">
</button>
        
        <div class="login-label">
            Touch to Sign In
        </div>

        <div class="login-footer">
            Microsoft 365 Authentication
        </div>

    </div>

</div>

<script src="./js/config.js"></script>
<script src="./js/auth.js"></script>

<script>

async function loginAndContinue(){

    await signIn();

    window.location.href =
        "report.html";
}

window.addEventListener(
    "load",
    async () => {

        try{

            await msalInstance.initialize();

            const accounts =
                msalInstance.getAllAccounts();

            if(accounts.length > 0){

                window.location.href =
                    "report.html";
            }

        } catch(error){

            console.error(error);
        }
    }
);

</script>

</body>

</html>
