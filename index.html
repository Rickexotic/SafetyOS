<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SafetyOS</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="./css/style.css">

    <!-- MSAL -->
    <script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
</head>

<body>

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h2>SafetyOS</h2>
            <small>Occupational Health &amp; Safety</small>
        </div>

        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>
                    <strong>Logged User:</strong>
                    <span id="userInfo">Not connected</span>
                </div>

                <button class="btn btn-primary"
                        onclick="signIn()">
                    Microsoft Login
                </button>

            </div>

            <hr>

            <h4>Report Incident</h4>

            <form id="incidentForm">

                <div class="mb-3">
                    <label class="form-label">Site</label>

                    <input type="text"
                           id="site"
                           class="form-control"
                           placeholder="Santiago Warehouse">
                </div>

                <div class="mb-3">
                    <label class="form-label">Incident Type</label>

                    <select id="incidentType"
                            class="form-select">
                        <option value="">Select...</option>
                        <option>Near Miss</option>
                        <option>Unsafe Condition</option>
                        <option>Property Damage</option>
                        <option>Injury</option>
                        <option>Environmental</option>
                        <option>Vehicle</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Severity</label>

                    <select id="severity"
                            class="form-select">
                        <option value="">Select...</option>
                        <option>Low</option>
                        <option>Medium</option>
                        <option>High</option>
                        <option>Critical</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>

                    <textarea id="description"
                              rows="5"
                              class="form-control"></textarea>
                </div>

                <button type="button"
                        class="btn btn-success"
                        onclick="submitIncident()">
                    Submit Incident
                </button>

            </form>

            <div class="mt-4">

                <div id="successMessage"
                     class="alert alert-success d-none">
                </div>

                <div id="errorMessage"
                     class="alert alert-danger d-none">
                </div>

            </div>

        </div>

    </div>

</div>

<script src="./js/config.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/graph.js"></script>
<script src="./js/app.js"></script>

</body>
</html>
