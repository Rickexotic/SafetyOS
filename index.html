<body>

    <div class="container mt-4">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">
                <h2 class="mb-0">SafetyOS</h2>
                <small>Occupational Health & Safety</small>
            </div>

            <div class="card-body">

                <div class="mb-4 d-flex justify-content-between align-items-center">

                    <div>
                        <strong>Logged User:</strong>
                        <span id="userInfo">Not connected</span>
                    </div>

                    <button
                        class="btn btn-primary"
                        onclick="signIn()">
                        Microsoft Login
                    </button>

                </div>

                <hr>

                <h4>Report Incident</h4>

                <form id="incidentForm">

                    <div class="mb-3">
                        <label class="form-label">Site</label>

                        <input
                            id="site"
                            type="text"
                            class="form-control"
                            placeholder="Santiago Warehouse">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Incident Type</label>

                        <select
                            id="incidentType"
                            class="form-select">

                            <option value="">Select...</option>
                            <option>Near Miss</option>
                            <option>Unsafe Condition</option>
