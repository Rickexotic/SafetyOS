<body>

<div class="container mt-4">

    <div class="card shadow">

     <div class="card-header">

    <div class="header-content">

        <div>

            <h2>SafetyOS</h2>

            <small>
                Report Incident
            </small>

        </div>

        <div id="profileContainer">

            <img
                id="profilePhoto"
                class="profile-photo d-none">

            <div
                id="profileInitials"
                class="profile-initials">

                RH

            </div>

        </div>

    </div>

</div>

        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center mb-4">


            </div>

            <hr>

                <form id="incidentForm">

                <div class="mb-3">
                    <label class="form-label">Site</label>

                    <input type="text"
                           id="site"
                           class="form-control"
                           placeholder="Ingrese ubicación del incidente">
                </div>

                <div class="mb-3">
                    <label class="form-label">Incident Type</label>

                    <select id="incidentType"
                            class="form-select">
                        <option value="">Select...</option>
                        <option>Near Miss</option>
                        <option>Unsafe Condition</option>
                        <option>Property Damage</option>
                        <option>Injury</option>
                        <option>Environmental</option>
                        <option>Vehicle</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Severity</label>

                    <select id="severity"
                            class="form-select">
                        <option value="">Select...</option>
                        <option>Low</option>
                        <option>Medium</option>
                        <option>High</option>
                        <option>Critical</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>

                    <textarea id="description"
                              rows="5"
                              class="form-control"></textarea>
                </div>

                <div class="mb-3">

      <div class="upload-content">

       <div class="mb-3">

    <label class="form-label">
        Photo Evidence
    </label>

    <input
        type="file"
        id="incidentPhoto"
        class="form-control dark-upload"
        accept="image/*">

</div>

    </div>

</label>

<div id="selectedFileName"
     class="selected-file">
</div>

<img
    id="previewImage"
    class="img-fluid rounded mt-2 d-none"
    style="max-height:250px;">
                    
</div>

                <button type="button"
                        class="btn btn-success"
                        onclick="submitIncident()">
                    Submit Incident
                </button>

            </form>

            <div class="mt-4">

                <div id="successMessage"
                     class="alert alert-success d-none">
                </div>

                <div class="mt-3">

    <button
        id="newIncidentBtn"
        class="btn btn-outline-primary d-none"
        onclick="resetForm()">

        Report Another Incident

    </button>

</div>

                <div id="errorMessage"
                     class="alert alert-danger d-none">
                </div>

            </div>

        </div>

    </div>

</div>

<script src="./js/config.js"></script>
